<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#001B5E"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Mi Bombonera"/>
<link rel="icon" href="escudo.svg" type="image/svg+xml"/>
<title>Mi Bombonera</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --azul:#001B5E; --azul-2:#003087; --oro:#F5C518; --oro-suave:#FDF3C4;
  --bg:#F4F5F8; --surface:#FFFFFF; --line:#E6E8EE; --text:#0E1630; --text-2:#5B6478; --text-3:#9AA1B2;
  --v:#16A34A; --e:#8A94A8; --d:#DC2626;
  --num:'Barlow Condensed','SF Pro Display',-apple-system,sans-serif;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#070C1C;--surface:#0E1630;--line:#1C2643;--text:#EEF1F8;--text-2:#A3ABC0;--text-3:#646E88;--oro-suave:#2A2610;--e:#7C869B;}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);min-height:100vh;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(76px + var(--safe-bottom));}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.2px;}

/* HERO */
.hero{background:var(--azul);color:#fff;padding:calc(16px + var(--safe-top)) 20px 20px;position:relative;overflow:hidden;}
.brand{display:flex;align-items:center;gap:10px;}
.brand img{width:30px;height:36px;object-fit:contain;}
.brand h1{font-size:15px;font-weight:600;letter-spacing:.2px;}
.brand p{font-size:11px;color:rgba(255,255,255,.55);margin-top:1px;}
.hero-main{display:flex;align-items:center;gap:18px;margin-top:20px;}
.ring{width:92px;height:92px;flex-shrink:0;position:relative;}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring .pct b{font-family:var(--num);font-size:25px;font-weight:700;line-height:1;color:var(--oro);}
.ring .pct small{font-size:9px;color:rgba(255,255,255,.6);margin-top:2px;letter-spacing:.4px;text-transform:uppercase;}
.hero-big{font-family:var(--num);font-size:56px;font-weight:700;line-height:.9;}
.hero-big span{font-size:24px;font-weight:500;color:rgba(255,255,255,.5);margin-left:4px;}
.hero-cap{font-size:13px;color:rgba(255,255,255,.7);margin-top:6px;}
.hero-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px;}
.hk{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 8px 7px;}
.hk .num{font-size:20px;font-weight:600;line-height:1;}
.hk .num span{font-size:13px;color:rgba(255,255,255,.45);font-weight:500;}
.hk .lbl{font-size:10px;color:rgba(255,255,255,.6);margin-top:4px;display:flex;align-items:center;gap:5px;}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0;}
.dot.v{background:var(--v);} .dot.e{background:var(--e);} .dot.d{background:var(--d);} .dot.g{background:var(--oro);}

/* TOOLBAR */
.toolbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);padding:calc(10px + var(--safe-top)) 16px 10px;border-bottom:1px solid var(--line);}
.tb-row{display:flex;gap:8px;align-items:center;}
.seg{display:flex;background:var(--line);border-radius:10px;padding:2px;flex:1;}
.seg button{flex:1;padding:7px 0;font-size:13px;font-weight:600;color:var(--text-2);border-radius:8px;transition:all .15s;}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12);}
.search-btn{width:36px;height:36px;border-radius:10px;background:var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-2);}
.search-btn.on{background:var(--azul);color:var(--oro);}
.search{display:none;margin-top:8px;}
.search.open{display:block;}
.search input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:16px;outline:none;}
.search input:focus{border-color:var(--azul-2);}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:500;color:var(--text-2);display:flex;align-items:center;gap:6px;}
.chip.on{background:var(--azul);border-color:var(--azul);color:#fff;}
.chip.on .dot{box-shadow:0 0 0 2px rgba(255,255,255,.25);}

/* YEAR */
.year{margin:14px 12px 0;background:var(--surface);border-radius:16px;overflow:hidden;border:1px solid var(--line);}
.year-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none;}
.year-num{font-family:var(--num);font-size:28px;font-weight:700;line-height:1;}
.year-info{flex:1;min-width:0;}
.year-line{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-bottom:6px;}
.year-line b{color:var(--text);font-weight:600;}
.wdl{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);gap:2px;}
.wdl i{display:block;height:100%;}
.wdl .v{background:var(--v);} .wdl .e{background:var(--e);} .wdl .d{background:var(--d);}
.chev{color:var(--text-3);transition:transform .2s;flex-shrink:0;}
.year.closed .chev{transform:rotate(-90deg);}
.year.closed .year-body{display:none;}
.tchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 16px 12px;}
.tchips::-webkit-scrollbar{display:none;}
.tchip{flex-shrink:0;padding:4px 10px;border-radius:999px;background:var(--bg);font-size:11px;font-weight:500;color:var(--text-2);}
.tchip.on{background:var(--oro);color:var(--azul);}

/* MATCH */
.match{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer;}
.match:active{background:var(--bg);}
.stub{width:42px;flex-shrink:0;text-align:center;border-radius:9px;padding:5px 0 4px;border:1.5px dashed var(--line);color:var(--text-3);}
.stub b{display:block;font-family:var(--num);font-size:20px;font-weight:700;line-height:1;}
.stub span{display:block;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.match.fui .stub{background:var(--oro);border:1.5px solid var(--oro);color:var(--azul);}
.mid{flex:1;min-width:0;}
.rival{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.meta{font-size:12px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.meta .alt{color:var(--azul-2);font-weight:500;}
@media (prefers-color-scheme:dark){.meta .alt{color:#7EA2FF;}}
.match.nofui .rival{color:var(--text-2);font-weight:500;}
.score{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.score .num{font-size:24px;font-weight:700;line-height:1;}
.match.nofui .score .num{color:var(--text-3);font-weight:600;}
.res{width:20px;height:20px;border-radius:6px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff;}
.res.g{background:var(--v);} .res.e{background:var(--e);} .res.p{background:var(--d);}
.match.nofui .res{opacity:.45;}
.detail{padding:0 16px 14px 70px;font-size:13px;}
.drow{display:flex;gap:10px;padding:5px 0;border-top:1px dashed var(--line);}
.drow:first-child{border-top:none;}
.dl{width:64px;flex-shrink:0;color:var(--text-3);font-size:12px;padding-top:1px;}
.dv{flex:1;color:var(--text);line-height:1.4;}
.gl{display:block;}
.gl.rv{color:var(--text-2);}
.empty{text-align:center;padding:60px 20px;color:var(--text-3);font-size:14px;}

/* PANELS (stats / goleadores) */
.panel{margin:14px 12px 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;}
.panel h2{font-size:13px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;}
.kgrid .num{font-size:30px;font-weight:700;line-height:1;}
.kgrid .lbl{font-size:11px;color:var(--text-3);margin-top:3px;display:flex;align-items:center;gap:5px;}
.bars{display:flex;align-items:flex-end;gap:5px;height:140px;padding-top:18px;}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;position:relative;}
.bar .track{width:100%;background:var(--line);border-radius:5px 5px 2px 2px;position:relative;display:flex;align-items:flex-end;}
.bar .fill{width:100%;background:var(--oro);border-radius:5px 5px 2px 2px;}
.bar .top{font-family:var(--num);font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:3px;}
.bar .yr{font-family:var(--num);font-size:11px;color:var(--text-3);margin-top:5px;}
.legend{display:flex;gap:14px;font-size:11px;color:var(--text-3);margin-top:10px;}
.legend span{display:flex;align-items:center;gap:5px;}
.sq{width:9px;height:9px;border-radius:2px;display:inline-block;}
.streaks{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.streak{background:var(--bg);border-radius:12px;padding:12px;}
.streak .num{font-size:34px;font-weight:700;line-height:1;}
.streak .lbl{font-size:12px;color:var(--text-2);margin-top:2px;}
.streak .sub{font-size:11px;color:var(--text-3);margin-top:6px;line-height:1.35;}
.list-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);}
.list-row:first-of-type{border-top:none;}
.lr-rank{width:22px;font-family:var(--num);font-size:15px;font-weight:600;color:var(--text-3);text-align:right;flex-shrink:0;}
.lr-main{flex:1;min-width:0;}
.lr-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lr-sub{font-size:11px;color:var(--text-3);margin-top:2px;}
.lr-bar{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden;}
.lr-bar i{display:block;height:100%;background:var(--oro);border-radius:3px;}
.lr-val{text-align:right;flex-shrink:0;}
.lr-val .num{font-size:22px;font-weight:700;line-height:1;}
.lr-val .num span{font-size:14px;color:var(--text-3);font-weight:500;}
.lr-val small{display:block;font-size:10px;color:var(--text-3);margin-top:2px;}
.more{width:100%;padding:12px 0 2px;font-size:13px;font-weight:600;color:var(--azul-2);}
@media (prefers-color-scheme:dark){.more{color:#7EA2FF;}}
.page-title{padding:calc(18px + var(--safe-top)) 20px 4px;}
.page-title h2{font-size:26px;font-weight:700;}
.page-title p{font-size:13px;color:var(--text-3);margin-top:2px;}

/* TAB BAR */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);padding-bottom:var(--safe-bottom);}
.tabbar-in{max-width:560px;margin:0 auto;display:flex;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;font-size:10px;font-weight:600;color:var(--text-3);}
.tab svg{width:22px;height:22px;}
.tab.on{color:var(--azul);}
@media (prefers-color-scheme:dark){.tab.on{color:var(--oro);}}
.view{display:none;} .view.on{display:block;}

.side{display:contents;}
.page-title.desk{display:none;}
body:not([data-view="partidos"]) .hero{display:none;}

/* DESKTOP */
@media (min-width:960px){
  body:not([data-view="partidos"]) .hero{display:block;}
  .app{max-width:none;display:grid;grid-template-columns:340px 1fr;padding-bottom:0;}
  .main > section{max-width:1080px;}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--azul);overflow-y:auto;}
  .hero{padding:32px 28px 24px;}
  .brand img{width:38px;height:46px;}
  .brand h1{font-size:18px;}
  .brand p{font-size:12px;}
  .hero-main{flex-direction:column;align-items:flex-start;gap:18px;margin-top:32px;}
  .ring{width:120px;height:120px;}
  .ring .pct b{font-size:32px;}
  .hero-big{font-size:72px;}
  .hero-row{grid-template-columns:1fr 1fr;gap:10px;margin-top:24px;}
  .hk{padding:12px 12px 10px;}
  .hk .num{font-size:26px;}
  .hk .lbl{font-size:12px;}
  .tabbar{position:static;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border-top:1px solid rgba(255,255,255,.1);padding:14px 16px 24px;margin-top:auto;}
  .tabbar-in{flex-direction:column;gap:2px;max-width:none;}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;border-radius:10px;font-size:14px;color:rgba(255,255,255,.6);}
  .tab svg{width:20px;height:20px;}
  .tab:hover{background:rgba(255,255,255,.06);color:#fff;}
  .tab.on,.tab.on:hover{background:rgba(245,197,24,.14);color:var(--oro);}
  .main{min-width:0;padding:0 32px 40px;}
  .page-title,.page-title.desk{display:block;padding:36px 4px 6px;}
  .page-title h2{font-size:30px;}
  .toolbar{top:0;margin:0 -32px;padding:12px 36px;}
  .tb-row{max-width:520px;}
  .search.open{max-width:520px;}
  .chips{margin:10px -36px 0;padding:0 36px;flex-wrap:wrap;overflow:visible;}
  .year{margin:16px 0 0;}
  .year-head{padding:16px 22px;}
  .year-num{font-size:32px;}
  .match{padding:12px 22px;gap:16px;}
  .match:hover{background:var(--bg);}
  .rival{font-size:16px;}
  .detail{padding:2px 22px 16px 80px;max-width:760px;}
  .tchips{padding:0 22px 14px;}
  .panel{margin:16px 0 0;padding:20px;}
  #stats{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
  #stats .panel{margin:0;}
  #stats .panel.wide{grid-column:1/-1;order:3;}
  #stats .panel.p-rachas{order:2;} #stats .panel.p-clas{order:4;} #stats .panel.p-riv{order:5;}
  #stats .bars{height:200px;}
  #v-stats .page-title{padding-bottom:20px;}
  #goles .panel{display:grid;grid-template-columns:1fr 1fr;column-gap:40px;}
  #goles .list-row:nth-child(2){border-top:none;}
  #goles .more{grid-column:1/-1;}
  #v-goles .toolbar{margin:0;padding:8px 0 0;max-width:360px;}
}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <header class="hero">
    <div class="brand">
      <img src="escudo.svg" alt="Boca Juniors">
      <div><h1>Mi Bombonera</h1><p id="rango">Partidos de local</p></div>
    </div>
    <div class="hero-main">
      <div class="ring">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="43" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="9"/><circle id="ring-arc" cx="50" cy="50" r="43" fill="none" stroke="#F5C518" stroke-width="9" stroke-linecap="round" stroke-dasharray="270.2" stroke-dashoffset="270.2"/></svg>
        <div class="pct"><b class="num" id="h-pct">0%</b><small>asistencia</small></div>
      </div>
      <div>
        <div class="hero-big" id="h-fui">0<span>/ 0</span></div>
        <div class="hero-cap">partidos en la cancha</div>
      </div>
    </div>
    <div class="hero-row" id="hero-row"></div>
  </header>
<nav class="tabbar"><div class="tabbar-in">
  <button class="tab on" data-view="partidos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Partidos</button>
  <button class="tab" data-view="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Estadísticas</button>
  <button class="tab" data-view="goles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m12 7 4 3-1.5 4.5h-5L8 10z"/></svg>Goleadores</button>
</div></nav>
</aside>
<main class="main">

<!-- PARTIDOS -->
<section class="view on" id="v-partidos">
  <div class="page-title desk"><h2>Partidos</h2><p>Tocá un partido para ver goles y técnicos</p></div>

  <div class="toolbar">
    <div class="tb-row">
      <div class="seg" id="seg">
        <button data-att="todos" class="on">Todos</button>
        <button data-att="fui">Fui</button>
        <button data-att="nofui">No fui</button>
      </div>
      <button class="search-btn" id="search-btn" aria-label="Buscar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
    </div>
    <div class="search" id="search"><input id="q" type="search" placeholder="Rival, torneo o año" autocomplete="off"></div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="list"></div>
</section>

<!-- ESTADÍSTICAS -->
<section class="view" id="v-stats">
  <div class="page-title"><h2>Estadísticas</h2><p id="stats-sub"></p></div>
  <div id="stats"></div>
</section>

<!-- GOLEADORES -->
<section class="view" id="v-goles">
  <div class="page-title"><h2>Goleadores</h2><p>Goles de Boca en la Bombonera · dorado = los que viste</p></div>
  <div class="toolbar" style="top:0;border-bottom:none;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;padding-top:8px;">
    <div class="seg" id="seg-gol">
      <button data-sort="total" class="on">Más goles</button>
      <button data-sort="vi">Más vistos</button>
    </div>
  </div>
  <div id="goles"></div>
</section>

</main>
</div>


<script>

const LIBERTADORES = ["Copa Libertadores 2013","Copa Libertadores 2015","Copa Libertadores 2016","Copa Libertadores 2018","Copa Libertadores 2019","Copa Libertadores 2022","Copa Libertadores 2023","Copa Libertadores 2025","Copa Libertadores 2026"];
const SUDAMERICANA = ["Copa Sudamericana 2014","Copa Sudamericana 2024","Copa Sudamericana 2026"];
const CLASICOS = ['River','Racing','Independiente','San Lorenzo'];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

const fui = m => m.asistio !== false;
const byDateDesc = (a,b) => b.date.localeCompare(a.date);

let att = 'todos', cat = null, q = '', expandedId = null, golSort = 'total', golAll = false;
const yearTorneo = {};
const years = [...new Set(MATCHES.map(m => m.year))].sort((a,b) => b - a);
const openYears = new Set([String(years[0])]);

const CATS = [
  {k:'v', label:'Victorias', dot:'v', fn:m => m.res === 'G'},
  {k:'e', label:'Empates', dot:'e', fn:m => m.res === 'E'},
  {k:'d', label:'Derrotas', dot:'d', fn:m => m.res === 'P'},
  {k:'super', label:'Superclásico', fn:m => m.rival === 'River'},
  {k:'clasicos', label:'Clásicos', fn:m => CLASICOS.includes(m.rival)},
  {k:'liber', label:'Libertadores', fn:m => LIBERTADORES.includes(m.torneo)},
  {k:'suda', label:'Sudamericana', fn:m => SUDAMERICANA.includes(m.torneo)},
];

// ── helpers ──────────────────────────────────────────
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shortTorneo(t){
  return t.replace(/\s+\d{4}(\/\d{4})?$/,'').replace(/^Torneo\s+/,'').replace(/^Copa (Libertadores|Sudamericana)$/,'$1');
}
function parseGoals(str) {
  if (!str || str === '-') return {boca:0, rival:0, scorers:[], bocaTxt:'', rivalTxt:''};
  const [bocaPart = '', rivalPart = ''] = str.split(' / ');
  const count = s => (!s || s.trim() === '-') ? 0 : (s.match(/\(/g) || []).length;
  const scorers = [];
  if (bocaPart && bocaPart.trim() !== '-') {
    bocaPart.split(', ').forEach(g => {
      const mm = g.match(/^([^(-]+)/);
      if (mm) { const name = mm[1].trim().replace(/-[a-záéíóúñ]+(-\s*$)?/gi,'').trim(); if (name) scorers.push(name); }
    });
  }
  return {boca:count(bocaPart), rival:count(rivalPart), scorers, bocaTxt:bocaPart.trim(), rivalTxt:rivalPart.trim()};
}
function prettyGoals(txt){
  if (!txt || txt === '-') return '—';
  return esc(txt).replace(/-pen-/g,'(p)').replace(/-cab-/g,'(c)').replace(/-TL-/g,'(tl)').replace(/-eg-/g,'(ec)');
}
function goalsHTML(g, rival){
  const has = t => t && t !== '-';
  const lines = [];
  if (has(g.bocaTxt)) lines.push(`<span class="gl">Boca: ${prettyGoals(g.bocaTxt)}</span>`);
  if (has(g.rivalTxt)) lines.push(`<span class="gl rv">${esc(rival)}: ${prettyGoals(g.rivalTxt)}</span>`);
  return lines.length ? lines.join('') : 'Sin goles';
}
function wdlBar(list){
  const g = list.filter(m=>m.res==='G').length, e = list.filter(m=>m.res==='E').length, p = list.filter(m=>m.res==='P').length;
  const t = g+e+p || 1;
  return `<div class="wdl">${g?`<i class="v" style="width:${g/t*100}%"></i>`:''}${e?`<i class="e" style="width:${e/t*100}%"></i>`:''}${p?`<i class="d" style="width:${p/t*100}%"></i>`:''}</div>`;
}
const chevron = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

// ── HERO ─────────────────────────────────────────────
function renderHero(){
  const total = MATCHES.length, mine = MATCHES.filter(fui);
  const pct = Math.round(mine.length / total * 100);
  document.getElementById('rango').textContent = `Partidos de local · ${Math.min(...years)}–${Math.max(...years)}`;
  document.getElementById('h-pct').textContent = pct + '%';
  document.getElementById('h-fui').innerHTML = `${mine.length}<span>/ ${total}</span>`;
  const C = 270.2;
  requestAnimationFrame(() => {
    const arc = document.getElementById('ring-arc');
    arc.style.transition = 'stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)';
    arc.style.strokeDashoffset = C * (1 - mine.length / total);
  });
  const cnt = (l,r) => l.filter(m => m.res === r).length;
  let golesVi = 0; mine.forEach(m => golesVi += parseGoals(m.goleadores).boca);
  const k = (n, of, lbl, dot) => `<div class="hk"><div class="num">${n}<span>/${of}</span></div><div class="lbl"><i class="dot ${dot}"></i>${lbl}</div></div>`;
  let golesTot = 0; MATCHES.forEach(m => golesTot += parseGoals(m.goleadores).boca);
  document.getElementById('hero-row').innerHTML =
    k(cnt(mine,'G'), cnt(MATCHES,'G'), 'Victorias', 'v') +
    k(cnt(mine,'E'), cnt(MATCHES,'E'), 'Empates', 'e') +
    k(cnt(mine,'P'), cnt(MATCHES,'P'), 'Derrotas', 'd') +
    k(golesVi, golesTot, 'Goles', 'g');
}

// ── FILTERS ──────────────────────────────────────────
function renderChips(){
  document.getElementById('chips').innerHTML = CATS.map(c =>
    `<button class="chip${cat===c.k?' on':''}" data-cat="${c.k}">${c.dot?`<i class="dot ${c.dot}"></i>`:''}${c.label}</button>`).join('');
}
function filtered(){
  const qq = q.toLowerCase().trim();
  const cf = cat ? CATS.find(c => c.k === cat).fn : null;
  return MATCHES.filter(m => {
    if (att === 'fui' && !fui(m)) return false;
    if (att === 'nofui' && fui(m)) return false;
    if (cf && !cf(m)) return false;
    if (qq && !m.rival.toLowerCase().includes(qq) && !m.torneo.toLowerCase().includes(qq) && !String(m.year).includes(qq)) return false;
    return true;
  });
}

// ── LIST ─────────────────────────────────────────────
function matchHTML(m){
  const d = new Date(m.date + 'T12:00:00');
  const isFui = fui(m), isExp = expandedId === m._id;
  const resL = m.res === 'G' ? 'V' : m.res === 'E' ? 'E' : 'D';
  const score = m.score.replace('-', '–');
  const meta = `${esc(shortTorneo(m.torneo))} · ${esc(m.fecha)}${m.cancha_alt ? ` · <span class="alt">en ${esc(m.cancha_alt)}</span>` : ''}`;
  let html = `<div class="match ${isFui ? 'fui' : 'nofui'}" data-id="${m._id}">
    <div class="stub"><b>${d.getDate()}</b><span>${MESES[d.getMonth()]}</span></div>
    <div class="mid"><div class="rival">${esc(m.rival)}</div><div class="meta">${meta}</div></div>
    <div class="score"><span class="num">${score}</span><span class="res ${m.res.toLowerCase()}">${resL}</span></div>
  </div>`;
  if (isExp) {
    const g = parseGoals(m.goleadores);
    const fecha = d.toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
    html += `<div class="detail">
      <div class="drow"><span class="dl">Fecha</span><span class="dv">${fecha}</span></div>
      <div class="drow"><span class="dl">Goles</span><span class="dv">${goalsHTML(g, m.rival)}</span></div>
      <div class="drow"><span class="dl">DT Boca</span><span class="dv">${esc(m.dt_boca || 'N/D')}</span></div>
      <div class="drow"><span class="dl">DT rival</span><span class="dv">${esc(m.dt_rival || 'N/D')}</span></div>
      ${m.nota ? `<div class="drow"><span class="dl">Memo</span><span class="dv" style="font-style:italic;color:var(--text-2)">${esc(m.nota)}</span></div>` : ''}
    </div>`;
  }
  return html;
}

function renderList(){
  const list = filtered();
  const box = document.getElementById('list');
  if (!list.length) { box.innerHTML = '<div class="empty">No hay partidos con estos filtros</div>'; return; }
  const forceOpen = !!(q.trim() || cat || att !== 'todos');
  const byYear = {};
  list.forEach(m => (byYear[m.year] = byYear[m.year] || []).push(m));
  box.innerHTML = Object.keys(byYear).sort((a,b) => b - a).map(yr => {
    const all = byYear[yr].sort(byDateDesc);
    const torneos = [...new Set(all.map(m => m.torneo))];
    const t = yearTorneo[yr];
    const ms = t ? all.filter(m => m.torneo === t) : all;
    const n = ms.filter(fui).length;
    const open = openYears.has(yr) || (forceOpen && Object.keys(byYear).length <= 3);
    return `<div class="year${open ? '' : ' closed'}">
      <div class="year-head" data-year="${yr}">
        <div class="year-num">${yr}</div>
        <div class="year-info">
          <div class="year-line"><span>Fui a <b>${n}</b> de ${ms.length}</span><span>${ms.filter(m=>m.res==='G').length}V · ${ms.filter(m=>m.res==='E').length}E · ${ms.filter(m=>m.res==='P').length}D</span></div>
          ${wdlBar(ms)}
        </div>
        ${chevron}
      </div>
      <div class="year-body">
        ${torneos.length > 1 ? `<div class="tchips">${torneos.map(tt => `<button class="tchip${t === tt ? ' on' : ''}" data-yr="${yr}" data-t="${esc(tt)}">${esc(shortTorneo(tt))}</button>`).join('')}</div>` : ''}
        ${ms.map(matchHTML).join('')}
      </div>
    </div>`;
  }).join('');
}

// ── STATS ────────────────────────────────────────────
function renderStats(){
  const asc = [...MATCHES].sort((a,b) => a.date.localeCompare(b.date));
  const mine = asc.filter(fui);
  let gf = 0, gc = 0; MATCHES.forEach(m => { const g = parseGoals(m.goleadores); gf += g.boca; gc += g.rival; });
  const cnt = r => MATCHES.filter(m => m.res === r).length;
  document.getElementById('stats-sub').textContent = `${MATCHES.length} partidos de local · ${Math.min(...years)}–${Math.max(...years)}`;

  // streaks
  let best = 0, bestEnd = -1, cur = 0;
  asc.forEach((m,i) => { if (fui(m)) { cur++; if (cur > best) { best = cur; bestEnd = i; } } else cur = 0; });
  let now = 0; for (let i = asc.length - 1; i >= 0 && fui(asc[i]); i--) now++;
  const fmt = m => { const d = new Date(m.date + 'T12:00:00'); return `${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`; };
  const bestRange = best ? `${fmt(asc[bestEnd - best + 1])} → ${fmt(asc[bestEnd])}` : '';
  let unbeaten = 0, ub = 0; mine.forEach(m => { if (m.res !== 'P') { ub++; unbeaten = Math.max(unbeaten, ub); } else ub = 0; });

  // por año
  const yAsc = [...years].sort((a,b) => a - b);
  const maxN = Math.max(...yAsc.map(y => MATCHES.filter(m => m.year === y).length));
  const bars = yAsc.map(y => {
    const all = MATCHES.filter(m => m.year === y), f = all.filter(fui).length;
    return `<div class="bar"><div class="top">${f}</div><div class="track" style="height:${all.length / maxN * 100}%"><div class="fill" style="height:${all.length ? f / all.length * 100 : 0}%"></div></div><div class="yr">'${String(y).slice(2)}</div></div>`;
  }).join('');

  // rivales
  const riv = {};
  MATCHES.forEach(m => { const r = riv[m.rival] = riv[m.rival] || {n:0, f:0, g:0, e:0, p:0}; r.n++; if (fui(m)) { r.f++; r[m.res.toLowerCase()]++; } });
  const rivRows = Object.entries(riv).sort((a,b) => b[1].f - a[1].f || b[1].n - a[1].n).slice(0, 8).map(([name, r], i) =>
    `<div class="list-row"><div class="lr-rank">${i+1}</div><div class="lr-main"><div class="lr-name">${esc(name)}</div><div class="lr-sub">Viste ${r.g}V · ${r.e}E · ${r.p}D</div></div><div class="lr-val"><div class="num">${r.f}<span>/${r.n}</span></div></div></div>`).join('');

  const clas = CLASICOS.map(c => { const r = riv[c] || {n:0,f:0,g:0,e:0,p:0};
    return `<div class="list-row"><div class="lr-main"><div class="lr-name">${c === 'River' ? 'River · Superclásico' : c}</div><div class="lr-sub">Viste ${r.g}V · ${r.e}E · ${r.p}D</div><div class="lr-bar"><i style="width:${r.n ? r.f / r.n * 100 : 0}%"></i></div></div><div class="lr-val"><div class="num">${r.f}<span>/${r.n}</span></div><small>fuiste</small></div></div>`; }).join('');

  document.getElementById('stats').innerHTML = `
    <div class="panel"><h2>Boca de local</h2><div class="kgrid">
      <div><div class="num">${MATCHES.length}</div><div class="lbl">Partidos</div></div>
      <div><div class="num">${gf}</div><div class="lbl">Goles a favor</div></div>
      <div><div class="num">${gc}</div><div class="lbl">Goles en contra</div></div>
      <div><div class="num">${cnt('G')}</div><div class="lbl"><i class="dot v"></i>Victorias</div></div>
      <div><div class="num">${cnt('E')}</div><div class="lbl"><i class="dot e"></i>Empates</div></div>
      <div><div class="num">${cnt('P')}</div><div class="lbl"><i class="dot d"></i>Derrotas</div></div>
    </div><div style="margin-top:14px">${wdlBar(MATCHES)}</div></div>

    <div class="panel wide"><h2>Asistencia por año</h2><div class="bars">${bars}</div>
      <div class="legend"><span><i class="sq" style="background:var(--oro)"></i>Fui</span><span><i class="sq" style="background:var(--line)"></i>Total del año</span></div></div>

    <div class="panel p-rachas"><h2>Rachas</h2><div class="streaks">
      <div class="streak"><div class="num">${best}</div><div class="lbl">seguidos en la cancha</div><div class="sub">${bestRange}</div></div>
      <div class="streak"><div class="num">${now}</div><div class="lbl">racha actual</div><div class="sub">partidos seguidos hasta el último</div></div>
      <div class="streak"><div class="num">${unbeaten}</div><div class="lbl">sin ver una derrota</div><div class="sub">partidos que fuiste, en fila</div></div>
      <div class="streak"><div class="num">${mine.length ? fmt(mine[0]).split(' ').pop() : '-'}</div><div class="lbl">primer partido</div><div class="sub">${mine.length ? `${esc(mine[0].rival)} · ${fmt(mine[0])}` : ''}</div></div>
    </div></div>

    <div class="panel p-clas"><h2>Clásicos</h2>${clas}</div>
    <div class="panel p-riv" style="margin-bottom:14px"><h2>Rivales que más viste</h2>${rivRows}</div>`;
}

// ── GOLEADORES ───────────────────────────────────────
function renderGoles(){
  const tally = {};
  MATCHES.forEach(m => { const f = fui(m); parseGoals(m.goleadores).scorers.forEach(n => { const t = tally[n] = tally[n] || {t:0, v:0}; t.t++; if (f) t.v++; }); });
  const rows = Object.entries(tally).sort((a,b) => golSort === 'vi' ? b[1].v - a[1].v || b[1].t - a[1].t : b[1].t - a[1].t || b[1].v - a[1].v);
  const max = rows.length ? Math.max(...rows.map(r => r[1].t)) : 1;
  const shown = golAll ? rows : rows.slice(0, 25);
  document.getElementById('goles').innerHTML = `<div class="panel" style="margin-bottom:14px">${shown.map(([n, r], i) => {
    const main = golSort === 'vi' ? r.v : r.t, other = golSort === 'vi' ? `de ${r.t}` : `viste ${r.v}`;
    return `<div class="list-row"><div class="lr-rank">${i+1}</div><div class="lr-main"><div class="lr-name">${esc(n)}</div>
      <div class="lr-bar" style="width:${r.t / max * 100}%"><i style="width:${r.v / r.t * 100}%"></i></div></div>
      <div class="lr-val"><div class="num">${main}</div><small>${other}</small></div></div>`;
  }).join('')}${!golAll && rows.length > 25 ? `<button class="more" id="gol-more">Ver los ${rows.length} goleadores</button>` : ''}</div>`;
}

// ── EVENTS ───────────────────────────────────────────
document.getElementById('seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  att = b.dataset.att;
  document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b));
  renderList();
});
document.getElementById('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  cat = cat === b.dataset.cat ? null : b.dataset.cat;
  renderChips(); renderList();
});
document.getElementById('search-btn').addEventListener('click', () => {
  const s = document.getElementById('search'), btn = document.getElementById('search-btn');
  const open = s.classList.toggle('open'); btn.classList.toggle('on', open);
  if (open) document.getElementById('q').focus(); else { q = ''; document.getElementById('q').value = ''; renderList(); }
});
document.getElementById('q').addEventListener('input', e => { q = e.target.value; renderList(); });
document.getElementById('list').addEventListener('click', e => {
  const yh = e.target.closest('.year-head');
  if (yh) { const y = yh.dataset.year; openYears.has(y) ? openYears.delete(y) : openYears.add(y); renderList(); return; }
  const tc = e.target.closest('.tchip');
  if (tc) { const y = tc.dataset.yr, t = tc.dataset.t; yearTorneo[y] === t ? delete yearTorneo[y] : yearTorneo[y] = t; renderList(); return; }
  const mc = e.target.closest('.match');
  if (mc) { expandedId = expandedId === mc.dataset.id ? null : mc.dataset.id; renderList(); }
});
document.getElementById('seg-gol').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  golSort = b.dataset.sort;
  document.querySelectorAll('#seg-gol button').forEach(x => x.classList.toggle('on', x === b));
  renderGoles();
});
document.getElementById('goles').addEventListener('click', e => { if (e.target.id === 'gol-more') { golAll = true; renderGoles(); } });

const VIEWS = {partidos:'v-partidos', stats:'v-stats', goles:'v-goles'};
function showView(v){
  if (!VIEWS[v]) v = 'partidos';
  Object.entries(VIEWS).forEach(([k, id]) => document.getElementById(id).classList.toggle('on', k === v));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.view === v));
  document.body.dataset.view = v;
  window.scrollTo(0, 0);
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  const v = t.dataset.view;
  if (location.hash !== '#' + v) location.hash = v === 'partidos' ? '' : v;
  showView(v);
}));
window.addEventListener('hashchange', () => showView(location.hash.slice(1)));

renderHero(); renderChips(); renderList(); renderStats(); renderGoles();
showView(location.hash.slice(1));
</script>
</body>
</html>
